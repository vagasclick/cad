<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html b:version='2' class='v2' expr:dir='data:blog.languageDirection' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>
    <head>
        <meta content='yQigN6Y2hMkyqXraxrlb9k2KJJs6It0Sq0oZQw8xQrM' name='google-site-verification'/>
        <meta content='width=device-width, initial-scale=1.0' name='viewport'/>

        <!-- Pré-conexão prioritária -->
        <link href='https://script.google.com' rel='preconnect'/>
        <link href='https://script.googleusercontent.com' rel='preconnect'/>

        <b:include data='blog' name='all-head-content'/>
        <title><data:blog.pageTitle/></title>
        
        <b:skin><![CDATA[
          html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: #ffffff; 
          }
        ]]></b:skin>
    </head>
    <body style='margin: 0; padding: 0; background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Roboto, sans-serif;'>
      <b:section id='main'/>

      <!-- INDICADOR FIXO -->
      <div id='loader' style='position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999999; transition: opacity 0.3s ease;'>
        <div style='border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 45px; height: 45px; animation: spin 0.8s linear infinite;'/>
        <p style='margin-top: 18px; color: #222222; font-size: 16px; font-weight: 600; text-align: center;'>Redirecionando para o cadastro. Por favor aguarde...</p>
        <style>
          @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
      </div>

      <!-- IFRAME -->
      <iframe frameborder='0' id='custom-iframe' style='width: 100%; min-height: 100vh; min-height: 100dvh; border: none; display: block; opacity: 0; transition: opacity 0.4s ease;' title='Cadastro de Vagas'/>

      <script type='text/javascript'>
        (function () {
          var BASE_URL = &#39;https://script.google.com/macros/s/AKfycbwKK7keNE7MYA6EGZB1BM68VmbY1fwj2Vo6lyJOiX1TMGdovgJpXtqOGsz2Z2TdWLWy4Q/exec&#39;;
          var params = new URLSearchParams(window.location.search);
          var cargo = params.get(&#39;cargo&#39;);
          var targetUrl = BASE_URL + (cargo ? &#39;?cargo=&#39; + encodeURIComponent(cargo) : &#39;&#39;);

          var iframe = document.getElementById(&#39;custom-iframe&#39;);
          var loader = document.getElementById(&#39;loader&#39;);

          function showIframe() {
            if (loader) loader.style.display = &#39;none&#39;;
            if (iframe) iframe.style.opacity = &#39;1&#39;;
          }

          iframe.addEventListener(&#39;load&#39;, showIframe);

          // Fallback: Esconde a tela de carregamento após 8 segundos mesmo se o iframe atrasar
          setTimeout(showIframe, 8000);

          iframe.src = targetUrl;
        })();
      </script>

      <b:include data='blog' name='google-analytics'/>
      <script async='async' src='https://www.googletagmanager.com/gtag/js?id=G-F77NSTS6TJ'/>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag(&#39;js&#39;, new Date());
        gtag(&#39;config&#39;, &#39;G-F77NSTS6TJ&#39;);
      </script>
    </body>
</html>
