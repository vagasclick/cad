<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Vagas</title>
  
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    html, body {
      width: 100%;
      height: 100%;
      /* Alterado de hidden para auto para permitir a rolagem se o conteúdo ultrapassar a tela */
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #ffffff;
    }

    /* Tela de carregamento */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* Altura dinâmica para telas mobile */
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    /* Círculo da Animação (Spinner) */
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 18px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Texto fixo */
    .loading-text {
      color: #222222;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
    }

    iframe {
      width: 100%;
      height: 100vh;
      height: 100dvh; /* Usa a altura dinâmica do navegador mobile */
      border: none;
      display: block;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <!-- Tela de Carregamento -->
  <div id="loader">
    <div class="spinner"></div>
    <p class="loading-text">Redirecionando para o cadastro. Por favor aguarde...</p>
  </div>

  <iframe id="custom-iframe" title="Cadastro de Vagas"></iframe>

  <script>
    (function () {
      var BASE_URL = 'https://script.google.com/macros/s/AKfycbwKK7keNE7MYA6EGZB1BM68VmbY1fwj2Vo6lyJOiX1TMGdovgJpXtqOGsz2Z2TdWLWy4Q/exec';
      var params = new URLSearchParams(window.location.search);
      var cargo = params.get('cargo');
      var targetUrl = BASE_URL + (cargo ? '?cargo=' + encodeURIComponent(cargo) : '');

      var iframe = document.getElementById('custom-iframe');
      var loader = document.getElementById('loader');

      function showIframe() {
        if (loader) loader.classList.add('hidden');
        if (iframe) iframe.style.opacity = '1';
      }

      iframe.addEventListener('load', showIframe);
      
      // Fallback: garante que a tela esconde após 8 segundos se o Google demorar
      setTimeout(showIframe, 8000);

      iframe.src = targetUrl;
    })();
  </script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F77NSTS6TJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F77NSTS6TJ');
  </script>

</body>
</html>
