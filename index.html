<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Vagas</title>

  <!-- SEM PARÂMETROS: redireciona IMEDIATAMENTE, antes de pintar qualquer coisa. -->
  <script>
    (function () {
      var BASE_URL = 'https://script.google.com/macros/s/AKfycbwKK7keNE7MYA6EGZB1BM68VmbY1fwj2Vo6lyJOiX1TMGdovgJpXtqOGsz2Z2TdWLWy4Q/exec';
      var hasParams = new URLSearchParams(window.location.search).toString().length > 0;
      if (!hasParams) window.location.replace(BASE_URL);
    })();
  </script>

  <!-- Conexões antecipadas (aceleram o caso COM parâmetros) -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #ffffff;
    }

    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    /* ===== SPINNER: anel girando + 3 pontos pulsando no centro ===== */
    .spinner {
      position: relative;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-bottom: 18px;
    }

    /* Anel do círculo (gira) */
    .spinner .ring {
      position: absolute;
      inset: 0;
      border: 3px solid #e3e8ef;
      border-top-color: #007bff; /* trecho azul que evidencia o giro */
      border-radius: 50%;
      animation: girar 0.9s linear infinite;
    }

    @keyframes girar {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Três pontos dentro (pulsam sem girar) */
    .spinner .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: #007bff;
      animation: dots 1.2s infinite ease-in-out both;
    }

    .spinner .dot:nth-child(2) { animation-delay: -0.16s; }
    .spinner .dot:nth-child(3) { animation-delay: 0s; }
    .spinner .dot:nth-child(4) { animation-delay: 0.16s; }

    @keyframes dots {
      0%, 80%, 100% { transform: scale(0.55); opacity: 0.35; }
      40%           { transform: scale(1);    opacity: 1; }
    }
    /* =============================================================== */

    .loading-text {
      color: #222222;
      font-size: 16px;
      font-weight: 600;
      text-align: center;
    }

    iframe {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: none;
      display: block;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .hidden { opacity: 0; visibility: hidden; }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner">
      <span class="ring"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
    <p class="loading-text">Redirecionando para o cadastro. Por favor aguarde...</p>
  </div>

  <!-- src padrão no próprio HTML: se o JS falhar, o formulário já carrega -->
  <iframe id="custom-iframe" title="Cadastro de Vagas"
    src="https://script.google.com/macros/s/AKfycbwKK7keNE7MYA6EGZB1BM68VmbY1fwj2Vo6lyJOiX1TMGdovgJpXtqOGsz2Z2TdWLWy4Q/exec"></iframe>

  <!-- Fluxo COM parâmetros: ajusta a URL e controla o loader -->
  <script>
    (function () {
      var BASE_URL = 'https://script.google.com/macros/s/AKfycbwKK7keNE7MYA6EGZB1BM68VmbY1fwj2Vo6lyJOiX1TMGdovgJpXtqOGsz2Z2TdWLWy4Q/exec';

      var params = new URLSearchParams(window.location.search);
      var cargo = params.get('cargo');

      var iframe = document.getElementById('custom-iframe');
      var loader = document.getElementById('loader');

      if (cargo) {
        iframe.src = BASE_URL + '?cargo=' + encodeURIComponent(cargo);
      }

      function showIframe() {
        if (loader) loader.classList.add('hidden');
        if (iframe) iframe.style.opacity = '1';
      }

      iframe.addEventListener('load', showIframe, { once: true });
      setTimeout(showIframe, 8000); // fallback se o Google demorar
    })();
  </script>

  <!-- Google Analytics deferido (não compete com o formulário) -->
  <script>
    (function () {
      function loadGA() {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){ dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', 'G-F77NSTS6TJ');

        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-F77NSTS6TJ';
        document.head.appendChild(s);
      }
      if ('requestIdleCallback' in window) requestIdleCallback(loadGA, { timeout: 4000 });
      else window.addEventListener('load', loadGA);
    })();
  </script>

</body>
</html>
