<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Vagas</title>

  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999999;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    iframe {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      border: none;
      display: block;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p style="margin-top: 18px; color: #222222; font-size: 16px; font-weight: 600; text-align: center;">
      Redirecionando para o cadastro. Por favor aguarde...
    </p>
  </div>

  <iframe id="custom-iframe" title="Cadastro de Vagas"></iframe>

  <script>
    (function () {
      var BASE_URL = 'https://script.google.com/macros/s/AKfycbwKK7keNE7MYA6EGZB1BM68VmbY1fwj2Vo6lyJOiX1TMGdovgJpXtqOGsz2Z2TdWLWy4Q/exec';
      var params = new URLSearchParams(window.location.search);
      var cargo = params.get('cargo');
      var targetUrl = BASE_URL + (cargo ? '?cargo=' + encodeURIComponent(cargo) : '');

      var iframe = document.getElementById('custom-iframe');
      var loader = document.getElementById('loader');

      function showIframe() {
        if (loader) loader.style.display = 'none';
        if (iframe) iframe.style.opacity = '1';
      }

      iframe.addEventListener('load', showIframe);
      setTimeout(showIframe, 8000); // Fallback de segurança

      iframe.src = targetUrl;
    })();
  </script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F77NSTS6TJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F77NSTS6TJ');
  </script>
</body>
</html>
