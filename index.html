            // Protege contra "open redirect": sem isso, qualquer pessoa poderia
            // montar um link para este formulário com "?origem=https://site-
            // malicioso.com/" e, após o envio, o candidato seria redirecionado
            // para lá em vez do site legítimo.
            // Só se aplica a window.__INITIAL_ORIGIN__ e document.referrer (sites
            // externos reais) — NÃO se aplica ao fallback sourceUrl, que é sempre
            // o próprio domínio script.google.com/googleusercontent.com do Apps
            // Script (implicitamente confiável).
            // Adicione aqui todo domínio que legitimamente linka para este
            // formulário. Ao trocar de domínio, atualize esta lista também.
            const ALLOWED_ORIGIN_HOSTS = [
                'vagasclick.blogspot.com'
            ];

            // Verifica se o host de uma URL está na allowlist (ou é um
            // subdomínio de um host listado, ex: "www.vagasclick.blogspot.com"
            // bate com "vagasclick.blogspot.com").
            const isAllowedOriginHost = (url) => {
                try {
                    const hostname = new URL(url, window.location.href).hostname.toLowerCase();
                    return ALLOWED_ORIGIN_HOSTS.some(allowed => {
                        const a = allowed.toLowerCase();
                        return hostname === a || hostname.endsWith('.' + a);
                    });
                } catch (e) {
                    return false;
                }
            };

            // Verifica se uma URL é um endereço absoluto válido e utilizável como
            // destino de redirecionamento (não é vazio, não é um domínio interno
            // do Apps Script, e não é a própria página atual).
            const isUsableReturnUrl = (url) => {
                if (!url) return false;
                try {
                    const parsed = new URL(url, window.location.href);
                    if (!/^https?:$/.test(parsed.protocol)) return false;
                    if (INTERNAL_APPS_SCRIPT_HOST_PATTERNS.some(host => parsed.hostname.includes(host))) {
                        return false;
                    }
                    return true;
                } catch (e) {
                    return false;
                }
            };

            // Reduz uma URL válida à raiz/início do domínio (protocolo + host +
            // "/"), descartando caminho, querystring e âncora. Isso garante que o
            // redirecionamento de volta sempre leve ao INÍCIO do site de origem
            // (ex: https://vagasclick.blogspot.com/), independente de qual página
            // ou vaga específica tenha originado o link.
            const normalizeToOrigin = (url) => {
                try {
                    const parsed = new URL(url, window.location.href);
                    return parsed.origin + '/';
                } catch (e) {
                    return url;
                }
            };

            // Endereço de retorno é calculado e VALIDADO uma única vez, no
            // carregamento do componente — antes de qualquer clique do usuário —
            // para que, ao clicar em "Fechar", o redirecionamento já saiba
            // exatamente para onde ir (ou se deve, em vez disso, apenas recarregar
            // o formulário com segurança).
            // Prioridade: 1) window.__INITIAL_ORIGIN__ — parâmetro "?origem=<url>"
            //                explícito enviado pelo site que linkou para cá. É a
            //                ÚNICA fonte confiável, pois document.referrer não
            //                reflete o site externo real dentro do iframe do Apps
            //                Script (ver comentário acima em __INITIAL_ORIGIN__);
            //             2) document.referrer, se por algum motivo vier um
            //                endereço externo válido (ex: testando fora do Apps
            //                Script, sem a camada extra de iframe);
            //             3) sourceUrl (a própria URL /exec?cargo=... acessada),
            //                se for válida — usada tal como está, SEM normalizar
            //                para raiz, pois nesse caso não há um "site de
            //                origem" real conhecido, apenas o próprio formulário;
            //             4) nenhum — nesse caso o botão apenas recarrega o form.
            // Em todos os casos de site de origem real (1 e 2), a URL é reduzida
            // ao início do domínio via normalizeToOrigin.
            const [returnUrl] = useState(() => {
                if (isUsableReturnUrl(window.__INITIAL_ORIGIN__)) {
                    return normalizeToOrigin(window.__INITIAL_ORIGIN__);
                }
                if (isUsableReturnUrl(document.referrer)) {
                    return normalizeToOrigin(document.referrer);
                }
                const source = getSourceUrl();
                if (isUsableReturnUrl(source)) {
                    return source;
                }
                return '';
            });

            // Redireciona o navegador de volta para o endereço de origem
            // pré-validado (returnUrl), ao clicar em "Fechar" no modal de
            // Parabéns após o envio. Se nenhum endereço válido foi encontrado no
            // carregamento da página, recarrega o formulário com segurança em vez
            // de arriscar uma página em branco.
            // Como o formulário roda dentro de um iframe interno do Apps Script,
            // tenta navegar a janela de nível superior (window.top) para sair do
            // iframe; se isso não for permitido (cross-origin), navega a própria
            // janela do iframe como último recurso.
            const redirectToOrigin = () => {
                if (!returnUrl) {
                    window.location.reload();
                    return;
                }
                try {
                    if (window.top && window.top !== window.self) {
                        window.top.location.href = returnUrl;
                        return;
                    }
                } catch (e) {
                    // Acesso a window.top bloqueado (cross-origin) — cai no fallback abaixo.
                }
                window.location.href = returnUrl;
            };

            const [formData, setFormData] = useState({
                // Position Applying For
                applyingFor: initialCargo,

                // Personal Info
                firstName: '',
                lastName: '',
                email: '',
                mobile: '',
                dob: '',
                religion: '',
                maritalStatus: '',
                gender: '',
                nationality: '',
                currentAddress: '',
                permanentAddress: '',

                // SSC
                sscInstitute: '',
                sscBoard: '',
                sscMajor: '',
                sscYear: '',
                sscGrade: '',

                // HSC
                hscInstitute: '',
                hscBoard: '',
                hscMajor: '',
                hscYear: '',
                hscGrade: '',

                // Bachelor
                bachelorDegree: '',
                bachelorInstitute: '',
                bachelorMajor: '',
                bachelorGrade: '',

                // Postgraduate
                postgraduateDegree: '',
                postgraduateInstitute: '',
                postgraduateMajor: '',
                postgraduateGrade: '',

                // Experience
                yearsOfExperience: '',
                lastOrganisation: '',
                lastDesignation: '',
                joiningDate: '',
                endDate: ''
            });

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: value
                }));
            };

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    // Check file type (PDF only)
                    if (!file.name.toLowerCase().endsWith('.pdf')) {
                        alert('Only PDF files are allowed. Please upload a PDF file.');
                        e.target.value = ''; // Clear the file input
                        return;
                    }
                    // Check file size (5MB limit)
                    if (file.size > 5 * 1024 * 1024) {
                        alert('File size must be less than 5MB');
                        e.target.value = ''; // Clear the file input
                        return;
                    }

                    // Convert file to base64
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setFileName(file.name);
                        setCvFile(event.target.result); // Store base64 data
                    };
                    reader.onerror = (error) => {
                        console.error('Error reading file:', error);
                        alert('Failed to read the file. Please try again.');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAdminLogin = (user) => {
                setIsAdminLoggedIn(true);
                setAdminUser(user);
                setShowLoginModal(false);
                console.log('Admin logged in:', user);
            };

            const handleAdminLogout = () => {
                setIsAdminLoggedIn(false);
                setAdminUser(null);
                // Clear any admin-related data
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                // Validate CV upload
                if (!fileName || !cvFile) {
                    alert('Please upload your CV (PDF format required)');
                    return;
                }

                setIsSubmitting(true);
                setSubmitMessage(null);

                try {
                    // Convert date values to ISO format
                    const formatDateToISO = (dateValue) => {
                        if (!dateValue) return '';
                        // For date inputs (YYYY-MM-DD), create date at midnight UTC to avoid timezone shifts
                        // For datetime-local inputs (YYYY-MM-DDTHH:MM), use the provided time
                        const date = new Date(dateValue);
                        if (dateValue.includes('T')) {
                            // Has time component (datetime-local)
                            return date.toISOString(); // Returns "2025-10-09T05:05:00.000Z"
                        } else {
                            // Date only - set to midnight UTC
                            const [year, month, day] = dateValue.split('-');
                            const utcDate = new Date(Date.UTC(year, month - 1, day, 0, 0, 0, 0));
                            return utcDate.toISOString(); // Returns "2025-10-14T00:00:00.000Z"
                        }
                    };

                    // Prepare submission data with ISO formatted dates
                    const submissionData = {
                        ...formData,
                        dob: formatDateToISO(formData.dob),
                        joiningDate: formatDateToISO(formData.joiningDate),
                        endDate: formatDateToISO(formData.endDate),
                        currentlyWorking: currentlyWorking,
                        // Endereço de onde veio o redirecionamento do parâmetro 'cargo':
                        // - sourceUrl: URL completa (com querystring) através da qual o
                        //   formulário foi acessado (a URL /exec?cargo=... ou a URL do
                        //   iframe, quando embutido em outra página).
                        // - referrerUrl: document.referrer bruto, tal como o navegador
                        //   informa de dentro do iframe interno do Apps Script (pode não
                        //   refletir o site externo real — ver returnUrl).
                        // - returnUrl: endereço de retorno já VALIDADO (prioriza o
                        //   parâmetro explícito "?origem=<url>" enviado pelo site que
                        //   linkou para cá), usado de fato no botão "Fechar".
                        sourceUrl: getSourceUrl(),
                        referrerUrl: document.referrer || '',
                        returnUrl: returnUrl
                    };

                    // Check if google.script.run is available (running in GAS environment)
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        // Running in Google Apps Script environment
                        google.script.run
                            .withSuccessHandler((response) => {
                                setIsSubmitting(false);
                                if (response.status === 'success') {
                                    // Show congratulations modal
                                    setShowCongratsModal(true);
                                } else {
                                    setSubmitMessage({
                                        type: 'error',
                                        text: response.message || 'Failed to submit application. Please try again.'
                                    });
                                }
                            })
                            .withFailureHandler((error) => {
                                setIsSubmitting(false);
                                setSubmitMessage({
                                    type: 'error',
                                    text: 'An error occurred: ' + error.message
                                });
                            })
                            .submitJobApplication(submissionData, fileName, cvFile);
                    } else {
                        // Running standalone (for testing)
                        setTimeout(() => {
                            setIsSubmitting(false);
                            const submissionTime = new Date().toISOString();
                            // Show congratulations modal
                            setShowCongratsModal(true);
                            console.log('Submission Time (ISO 8601):', submissionTime);
                            console.log('Form Data:', submissionData);
                            console.log('CV File:', fileName);
                        }, 2000);
                    }

                } catch (error) {
                    setIsSubmitting(false);
                    setSubmitMessage({
                        type: 'error',
                        text: 'Failed to submit application. Please try again.'
                    });
                    console.error('Submission error:', error);
                }
            };

            // If admin is logged in, show dashboard
            if (isAdminLoggedIn && adminUser) {
                return (
                    <AdminDashboard
                        adminUser={adminUser}
                        onLogout={handleAdminLogout}
                    />
                );
            }

            // Otherwise, show the application form
            return (
                <>
                    {isSubmitting && (
                        <div className="loading-overlay">
                            <div className="loading-spinner">
                                <div className="spinner"></div>
                                <h3 style={{ color: '#2e7d32', marginBottom: '8px' }}>Submitting Application...</h3>
                                <p style={{ color: '#66bb6a', fontSize: '14px' }}>Please wait while we process your application</p>
                            </div>
                        </div>
                    )}

                    <CongratsModal
                        isOpen={showCongratsModal}
                        onClose={() => {
                            setShowCongratsModal(false);
                            redirectToOrigin(); // Volta para o endereço de origem do redirecionamento
                        }}
                        applicantName={formData.firstName}
                        applicantEmail={formData.email}
                    />

                    <AdminLoginModal
                        isOpen={showLoginModal}
                        onClose={() => setShowLoginModal(false)}
                        onLoginSuccess={handleAdminLogin}
                    />
